<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Gato</title>

  <!-- Bootstrap 5 & FontAwesome icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #eef2f3 0%, #e0eafc 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --accent-color: #6c5ce7;
      --accent-hover: #5b4bc4;
      --text-dark: #2d3436;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo decorativo sutil con marca de agua */
    body::before {
      content: "\f6be";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      font-size: 30rem;
      color: rgba(108, 92, 231, 0.03);
      top: -10%;
      right: -10%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .header-icon {
      width: 70px;
      height: 70px;
      background: rgba(108, 92, 231, 0.1);
      color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem auto;
      font-size: 2rem;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #4a5568;
    }

    .input-group-text {
      background: #f8fafc;
      border-right: none;
      color: #a0aec0;
      border-top-left-radius: 0.75rem;
      border-bottom-left-radius: 0.75rem;
    }

    .form-control {
      border-left: none;
      background: #f8fafc;
      border-top-right-radius: 0.75rem;
      border-bottom-right-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      background: #ffffff;
      box-shadow: none;
      border-color: #cbd5e0;
    }

    .input-group:focus-within .input-group-text {
      background: #ffffff;
      color: var(--accent-color);
    }

    .btn-custom {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
    }

    .btn-custom:hover {
      background-color: var(--accent-hover);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(108, 92, 231, 0.35);
    }

    .cat-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.5rem 0;
      color: #cbd5e0;
    }

    .cat-divider::before, .cat-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .cat-divider i {
      padding: 0 10px;
      font-size: 0.8rem;
    }

    #resultado {
      display: none;
      border-radius: 0.75rem;
    }
  </style>
</head>

<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="card p-4 p-md-5">

          <!-- Ícono principal y título -->
          <div class="text-center">
            <div class="header-icon">
              <i class="fa-solid fa-cat"></i>
            </div>
            <h2 class="fw-bold mb-1" style="letter-spacing: -0.5px;">Registro de Gato</h2>
            <p class="text-muted small">Ingresa la información técnica de la mascota</p>
          </div>

          <div class="cat-divider">
            <i class="fa-solid fa-paw"></i>
          </div>

          <form id="formGato">

            <!-- Nombre -->
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-signature"></i></span>
                <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
              </div>
            </div>

            <!-- Edad -->
            <div class="mb-3">
              <label class="form-label">Edad (años)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-cake-candles"></i></span>
                <input type="number" class="form-control" id="edad" required min="0" step="0.1" placeholder="Ej: 2.5">
              </div>
            </div>

            <!-- Peso -->
            <div class="mb-3">
              <label class="form-label">Peso (kg)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-weight-scale"></i></span>
                <input type="number" class="form-control" id="peso" required min="0" step="0.1" placeholder="Ej: 4.2">
              </div>
            </div>

            <!-- Raza -->
            <div class="mb-4">
              <label class="form-label">Raza</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-dna"></i></span>
                <input type="text" class="form-control" id="raza" required placeholder="Ej: Siamés">
              </div>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn btn-custom w-100 d-flex align-items-center justify-content-center gap-2">
              <span>Registrar Gato</span>
              <i class="fa-solid fa-paw"></i>
            </button>

          </form>

          <!-- Respuesta del backend -->
          <div id="resultado" class="alert mt-4 text-center" role="alert"></div>

        </div>

      </div>
    </div>
  </div>

  <script>
    // URL de tu backend en Render con tu endpoint asignado
    const BACKEND_URL = "https://backend-gato.onrender.com/gato"; 

    document.getElementById("formGato").addEventListener("submit", async (e) => {
      e.preventDefault();

      const datos = {
        nombre: document.getElementById("nombre").value.trim(),
        edad: Number(document.getElementById("edad").value),
        peso: Number(document.getElementById("peso").value),
        raza: document.getElementById("raza").value.trim()
      };

      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.style.display = "none";

      try {
        const respuesta = await fetch(BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(datos)
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          resultadoDiv.className = "alert alert-success mt-4";
          resultadoDiv.textContent = data.mensaje || "¡Gato registrado con éxito!";
          document.getElementById("formGato").reset(); // Limpia los inputs tras guardar
        } else {
          resultadoDiv.className = "alert alert-danger mt-4";
          resultadoDiv.textContent = data.mensaje || "Error al registrar el gato";
        }

        resultadoDiv.style.display = "block";

      } catch (error) {
        resultadoDiv.className = "alert alert-danger mt-4";
        resultadoDiv.textContent = "Error de conexión con el servidor.";
        resultadoDiv.style.display = "block";
      }
    });
  </script>

</body>

</html>
